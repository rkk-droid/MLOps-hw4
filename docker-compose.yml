services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: hw04-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: dbt
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_DB: transactions_db
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "dbt", "--query", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  clickhouse_data:
