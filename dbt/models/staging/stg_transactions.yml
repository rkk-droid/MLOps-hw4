version: 2

models:
  - name: stg_transactions
    description: >
      Очищенные транзакции. Типы приведены к числам и дате, строки обрезаны,
      пол и штат переведены в верхний регистр. Клиент — это связка имени,
      фамилии и координат: отдельного id в источнике нет, а одинаковые
      имя и фамилия встречаются у разных людей.
    columns:
      - name: transaction_time
        description: Время транзакции.
        data_tests:
          - not_null
      - name: transaction_date
        description: Календарная дата транзакции.
        data_tests:
          - not_null
      - name: hour_of_day
        description: Час транзакции, 0–23.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 23
      - name: day_of_week
        description: День недели в режиме dbt_date для ClickHouse. 0 — воскресенье, 6 — суббота.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
      - name: day_name
        description: Английское название дня недели.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Sunday
                  - Monday
                  - Tuesday
                  - Wednesday
                  - Thursday
                  - Friday
                  - Saturday
      - name: merch
        description: Мерчант.
        data_tests:
          - not_null
      - name: cat_id
        description: Категория.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - gas_transport
                  - grocery_pos
                  - grocery_net
                  - home
                  - shopping_pos
                  - shopping_net
                  - kids_pets
                  - entertainment
                  - food_dining
                  - personal_care
                  - health_fitness
                  - misc_pos
                  - misc_net
                  - travel
      - name: amount
        description: Сумма транзакции.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000
                strictly: true
      - name: amount_bucket
        description: '{{ doc("amount_bucket") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["small", "medium", "large", "xlarge"]
      - name: is_large_transaction
        description: '{{ doc("is_large_transaction") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: name_1
        description: Имя клиента.
        data_tests:
          - not_null
      - name: name_2
        description: Фамилия клиента.
        data_tests:
          - not_null
      - name: gender
        description: Пол, M или F.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["M", "F"]
      - name: us_state
        description: Код штата.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('us_states')
                field: state_code
      - name: lat
        description: Широта клиента.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -90
                max_value: 90
      - name: lon
        description: Долгота клиента.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -180
                max_value: 180
      - name: merchant_lat
        description: Широта мерчанта.
        data_tests:
          - not_null
      - name: merchant_lon
        description: Долгота мерчанта.
        data_tests:
          - not_null
      - name: target
        description: Исходный признак фрода.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_fraud
        description: То же, что target. 1 — фрод.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: customer_id
        description: Суррогатный ключ клиента из имени, фамилии, широты и долготы.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_fraud = target"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(amount >= {{ var('large_amount_threshold') }} and is_large_transaction = 1) or (amount < {{ var('large_amount_threshold') }} and is_large_transaction = 0)"
