version: 2

models:
  - name: mart_daily_state_metrics
    description: Дневные метрики транзакций по штатам. Зерно — дата и штат.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - transaction_date
              - us_state
      - dbt_utils.expression_is_true:
          arguments:
            expression: "large_txn_count <= txn_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "txn_count > 0"
    columns:
      - name: transaction_date
        description: Дата транзакций.
        data_tests:
          - not_null
      - name: us_state
        description: Код штата.
        data_tests:
          - not_null
      - name: txn_count
        description: Число транзакций.
        data_tests:
          - not_null
      - name: total_amount
        description: Сумма транзакций.
        data_tests:
          - not_null
      - name: avg_amount
        description: Средний чек.
        data_tests:
          - not_null
      - name: p95_amount
        description: Точный 95-й перцентиль суммы внутри дня и штата.
        data_tests:
          - not_null
      - name: large_txn_count
        description: Число крупных транзакций, сумма не меньше 200.
        data_tests:
          - not_null
      - name: large_txn_share
        description: Доля крупных транзакций, в процентах.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100

  - name: mart_fraud_by_category
    description: Фрод по категориям мерчантов. Зерно — категория.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fraud_count <= txn_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fraud_amount <= total_amount"
    columns:
      - name: cat_id
        description: Категория.
        data_tests:
          - not_null
          - unique
      - name: txn_count
        description: Число транзакций.
        data_tests:
          - not_null
      - name: fraud_count
        description: Число мошеннических транзакций.
        data_tests:
          - not_null
      - name: fraud_rate
        description: '{{ doc("fraud_rate") }}'
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: total_amount
        description: Оборот категории.
        data_tests:
          - not_null
      - name: fraud_amount
        description: Сумма мошеннических транзакций.
        data_tests:
          - not_null
      - name: avg_amount
        description: Средний чек.
        data_tests:
          - not_null

  - name: mart_fraud_by_state
    description: Фрод по штатам. Зерно — штат. Название штата берётся из справочника us_states.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fraud_count <= txn_count"
    columns:
      - name: us_state
        description: Код штата.
        data_tests:
          - not_null
          - unique
      - name: state_name
        description: Название штата.
        data_tests:
          - not_null
      - name: txn_count
        description: Число транзакций.
        data_tests:
          - not_null
      - name: fraud_count
        description: Число мошеннических транзакций.
        data_tests:
          - not_null
      - name: fraud_rate
        description: '{{ doc("fraud_rate") }}'
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: total_amount
        description: Оборот штата.
        data_tests:
          - not_null
      - name: fraud_amount
        description: Сумма мошеннических транзакций.
        data_tests:
          - not_null
      - name: unique_customers
        description: Число уникальных клиентов.
        data_tests:
          - not_null
      - name: unique_merchants
        description: Число уникальных мерчантов.
        data_tests:
          - not_null

  - name: mart_customer_risk_profile
    description: Профиль риска клиента. Зерно — customer_id.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fraud_count <= txn_count"
    columns:
      - name: customer_id
        description: Суррогатный ключ клиента.
        data_tests:
          - not_null
          - unique
      - name: name_1
        description: Имя.
        data_tests:
          - not_null
      - name: name_2
        description: Фамилия.
        data_tests:
          - not_null
      - name: us_state
        description: Штат клиента.
        data_tests:
          - not_null
      - name: txn_count
        description: Число транзакций клиента.
        data_tests:
          - not_null
      - name: fraud_count
        description: Число мошеннических транзакций.
        data_tests:
          - not_null
      - name: total_amount
        description: Сумма транзакций клиента.
        data_tests:
          - not_null
      - name: avg_amount
        description: Средний чек клиента.
        data_tests:
          - not_null
      - name: fraud_rate
        description: '{{ doc("fraud_rate") }}'
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: first_transaction_time
        description: Время первой транзакции.
        data_tests:
          - not_null
      - name: last_transaction_time
        description: Время последней транзакции.
        data_tests:
          - not_null
      - name: risk_segment
        description: '{{ doc("risk_segment") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["HIGH", "MEDIUM", "LOW"]

  - name: mart_hourly_fraud_pattern
    description: Фрод по дню недели и часу. Зерно — день недели и час.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - day_of_week
              - hour_of_day
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fraud_count <= txn_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(is_elevated_risk = 1 and fraud_rate >= overall_fraud_rate * {{ var('elevated_risk_multiplier') }}) or (is_elevated_risk = 0 and fraud_rate < overall_fraud_rate * {{ var('elevated_risk_multiplier') }})"
    columns:
      - name: day_of_week
        description: День недели, 0 — воскресенье.
        data_tests:
          - not_null
      - name: day_name
        description: Название дня недели.
        data_tests:
          - not_null
      - name: hour_of_day
        description: Час, 0–23.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 23
      - name: txn_count
        description: Число транзакций в слоте.
        data_tests:
          - not_null
      - name: fraud_count
        description: Число мошеннических транзакций.
        data_tests:
          - not_null
      - name: total_amount
        description: Сумма транзакций слота.
        data_tests:
          - not_null
      - name: fraud_rate
        description: '{{ doc("fraud_rate") }}'
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: overall_fraud_rate
        description: Общая доля фрода по всем транзакциям, одна и та же на каждой строке.
        data_tests:
          - not_null
      - name: is_elevated_risk
        description: '{{ doc("is_elevated_risk") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: mart_merchant_analytics
    description: Метрики мерчанта. Зерно — мерчант.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fraud_count <= txn_count"
    columns:
      - name: merch
        description: Мерчант.
        data_tests:
          - not_null
          - unique
      - name: txn_count
        description: Число транзакций.
        data_tests:
          - not_null
      - name: turnover
        description: Оборот мерчанта.
        data_tests:
          - not_null
      - name: avg_amount
        description: Средний чек.
        data_tests:
          - not_null
      - name: fraud_count
        description: Число мошеннических транзакций.
        data_tests:
          - not_null
      - name: fraud_rate
        description: '{{ doc("fraud_rate") }}'
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: unique_customers
        description: Число уникальных клиентов.
        data_tests:
          - not_null
      - name: category_count
        description: Сколько разных категорий встретилось у мерчанта.
        data_tests:
          - not_null
      - name: is_suspicious
        description: '{{ doc("is_suspicious") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
